<!DOCTYPE html>
<html>

<head>
    <title>Edit Expense</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">
        <div class="form-wrapper">
            <h1>Edit Expense</h1>

            <p class="subtitle">
                Update your expense details.
            </p>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <form method="post">
                <label>Amount</label>
                <input type="number" step="0.01" name="amount" value="{{ expense['amount'] }}" required>

                <label>Description</label>
                <input type="text" name="description" value="{{ expense['description'] }}" maxlength="200" required>

                <label>Date</label>
                <input type="date" name="expense_date" value="{{ expense['expense_date'] }}" required>

                <label>Category</label>
                <select name="category_id" required>
                    {% for category in categories %}
                    <option value="{{ category['id'] }}" {% if expense['category_id']==category['id'] %}selected{% endif
                        %}>
                        {{ category['category_name'] }}
                    </option>
                    {% endfor %}
                </select>

                <button type="submit" class="button button-primary">
                    Save Changes
                </button>
            </form>

            <div class="nav">
                <a class="button button-secondary" href="/dashboard">
                    Cancel
                </a>
            </div>
        </div>
    </div>

</body>

</html>
