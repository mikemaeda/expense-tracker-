<!DOCTYPE html>
<html>

<head>
    <title>Add Expense</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">
        <div class="form-wrapper">
            <h1>Add New Expense</h1>

            <p class="subtitle">
                Record a new spending transaction.
            </p>

            {% if error %}
            <div class="error-alert">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}

            <form method="post">
                <div class="form-group">
                    <label for="amount">Amount *</label>
                    <div class="input-group">
                        <span class="input-prefix">$</span>
                        <input type="number" id="amount" step="0.01" name="amount" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <input type="text" id="description" name="description" placeholder="What did you spend on?"
                        maxlength="200" required>
                </div>

                <div class="form-group">
                    <label for="expense_date">Date *</label>
                    <input type="date" id="expense_date" name="expense_date" required>
                </div>

                <div class="form-group">
                    <label for="category_id">Category *</label>
                    <select id="category_id" name="category_id" required>
                        <option value="">-- Select a category --</option>
                        {% for category in categories %}
                        <option value="{{ category[0] }}">
                            {{ category[1] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="button button-primary">
                    Save Expense
                </button>
            </form>

            <div class="nav">
                <a class="button button-secondary" href="/dashboard">
                    Back to Dashboard
                </a>
            </div>
        </div>
    </div>

</body>

</html>
